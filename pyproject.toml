[project]
name = "skevals"
version = "0.2.0"
description = "A/B testing CLI for Claude Code skills — zero-dependency, runs with Python stdlib only"
readme = "README.md"
authors = [
    { name = "Andres Fortunato", email = "andfortu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
